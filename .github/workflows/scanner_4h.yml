name: 4H Summary Scanner

on:
  schedule:
    # 0,4,8,12,16,20 UTC ตรงกับเวลาไทย 07,11,15,19,23,03 น.
    - cron: '2 0,4,8,12,16,20 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas numpy

      - name: Run 4H Scanner
        run: |
          python scanner.py
