name: 4H Summary Scanner

on:
  schedule:
    # รันเวลาไทย: 07:05, 11:05, 15:05, 19:05, 23:05, 03:05 (UTC: 00, 04, 08, 12, 16, 20)
    - cron: '5 0,4,8,12,16,20 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas numpy

      - name: Run 4H Scanner
        run: |
          python scanner_4h.py
