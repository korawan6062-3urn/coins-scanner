name: 4H Summary Scanner

on:
  schedule:
    # 00:05, 04:05, 08:05, 12:05, 16:05, 20:05 UTC (เวลาไทย: 07:05, 11:05, 15:05, 19:05, 23:05, 03:05)
    - cron: '5 0,4,8,12,16,20 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests pandas numpy
      - run: python scanner_4h.py
