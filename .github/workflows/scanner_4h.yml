name: 4H Summary Scanner

on:
  workflow_dispatch:
  schedule:
    # รันเวลาไทย: 07:01, 11:01, 15:01, 19:01, 23:01, 03:01 (UTC: 00, 04, 08, 12, 16, 20)
    - cron: '1 0,4,8,12,16,20 * * *'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas numpy

      - name: Run 4H Scanner
        run: |
          python scanner_4h.py
