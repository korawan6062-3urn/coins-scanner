name: 15M Trigger Scanner (Active Day Session)

on:
  schedule:
    # รันทุก 15 นาที (นาทีที่ 02, 17, 32, 47) 
    # ตั้งแต่ 07:02 - 00:47 น. เวลาไทย (00:00 - 17:00 UTC)
    - cron: '2,17,32,47 0-17 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas numpy

      - name: Run 15M Trigger
        run: python scanner_15m.py
