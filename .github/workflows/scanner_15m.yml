name: 15M Trigger Scanner

on:
  schedule:
    # รันทุก 15 นาทีที่นาทีที่ 04, 19, 34, 49 ของทุกชั่วโมง (UTC)
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas numpy

      - name: Run 15M Scanner
        run: |
          python scanner_15m.py
